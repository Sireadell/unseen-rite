name: keep-live
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visit the live page so it stays awake
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -m 60 -w "%{http_code}" https://8080-agqzdriiap4uvbbh3fug67gogm.instabox.tech/health || true)
            echo "attempt $i: $code"
            test "$code" = "200" && exit 0
            sleep 20
          done
          exit 1
