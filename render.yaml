services:
  - type: web
    name: unseen-rite
    runtime: python
    plan: free
    buildCommand: echo no build
    startCommand: python web/app.py
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: KEEP_AWAKE_URL
        value: https://unseen-rite.sireadell.tech/health
